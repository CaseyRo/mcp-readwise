[project]
name = "mcp-readwise"
version = "0.6.0"
description = "MCP server for Readwise built on FastMCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "markdown>=3.7",
    "pypandoc>=1.13",
    "aiosmtplib>=3.0",
    # Security floors (transitives of fastmcp; pinned to address CVEs)
    "authlib>=1.6.11",            # GHSA: CSRF when using cache
    "python-multipart>=0.0.27",   # GHSA: DoS via unbounded multipart headers
]

[project.scripts]
mcp-readwise = "mcp_readwise.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_readwise"]
artifacts = [
    "mcp_readwise/assets/**/*.css",
    "mcp_readwise/assets/**/*.woff2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.36",
    "ruff>=0.15",
]
