[project]
name = "mcp-readwise"
version = "0.7.3"
description = "MCP server for Readwise built on FastMCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Casey Romkes" }]
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.13.0",
    "markdown>=3.7",
    "pypandoc>=1.13",
    "aiosmtplib>=3.0",
    # Security floors (transitives of fastmcp; pinned to address CVEs)
    "authlib>=1.7.0",             # GHSA: CSRF in token cache handling
    "python-multipart>=0.0.27",   # GHSA: DoS via unbounded multipart headers
]

[project.scripts]
mcp-readwise = "mcp_readwise.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_readwise"]
artifacts = [
    "mcp_readwise/assets/**/*.css",
    "mcp_readwise/assets/**/*.woff2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.36",
    "ruff>=0.15",
]

[tool.ruff.lint]
# Pinned rather than inherited: ruff's default rule set widens between releases,
# so a dev-tools bump could turn a clean tree red (CDI-1783). Same set fleet-wide.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
# UP042 (str+Enum -> StrEnum) changes str() of enum values, which can be persisted or on the wire: fleet decision is no.
ignore = [
    "UP042",
    # RUF001/2/3 flag "ambiguous" unicode: en dashes and the x sign in prose and
    # tool text. The rule targets homoglyphs in identifiers; here it would only
    # object to correct typography (same call as mcp-stolperfalle).
    "RUF001",
    "RUF002",
    "RUF003",
]
# The `noqa: BLE001` on deliberate defensive catches documents intent for a rule
# this set leaves off (fleet position); external keeps RUF100 from deleting it.
external = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from CDiT-infrastructure/scripts/mcp_usage_middleware.py; re-copy, never edit here.
# Its noqa directives (UP017, BLE001, S110) serve repos with other rule sets.
"mcp_readwise/usage.py" = ["RUF100", "UP017"]
